# One command brings up the app + automatic HTTPS.
#   docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=8080
    volumes:
      - ./data:/app/data        # SQLite DB persists across restarts
    expose:
      - "8080"                  # internal only; Caddy is the public entrypoint

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # Let's Encrypt certs persist here
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
